<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Blue Swim School — KPI Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --blue:#0057FF; --blue-bg:#EEF3FF;
  --green:#047857; --green-bg:#ECFDF5;
  --red:#B91C1C;   --red-bg:#FEF2F2;
  --text:#111827;  --text-2:#6B7280; --text-3:#9CA3AF;
  --border:#E5E7EB; --border-2:#D1D5DB;
  --bg:#F3F4F6; --card:#FFFFFF;
  --r:10px; --r-sm:6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
.header{position:sticky;top:0;z-index:200;background:var(--card);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--blue);color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.header-right{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-2);}
.pill{background:var(--blue-bg);color:var(--blue);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:500;}
.banner{background:var(--blue);color:white;padding:8px 1.5rem;font-size:12px;display:flex;align-items:center;gap:2rem;flex-wrap:wrap;}
.banner b{font-weight:600;} .banner span{opacity:.75;}
.main{padding:1.25rem 1.5rem 4rem;max-width:1600px;margin:0 auto;}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.25rem;}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;}
.sc.accent{background:var(--blue);border-color:var(--blue);}
.sc-label{font-size:11px;font-weight:500;color:var(--text-2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
.sc.accent .sc-label{color:rgba(255,255,255,.65);}
.sc-val{font-size:22px;font-weight:600;color:var(--text);line-height:1.1;font-family:'DM Mono',monospace;}
.sc.accent .sc-val{color:white;}
.sc-sub{font-size:11px;color:var(--text-3);margin-top:3px;}
.sc.accent .sc-sub{color:rgba(255,255,255,.55);}
.view-toggle{display:flex;gap:6px;margin-bottom:1.25rem;align-items:center;}
.vt-btn{padding:7px 18px;border-radius:99px;border:1px solid var(--border-2);background:var(--card);color:var(--text-2);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;}
.vt-btn.active{background:var(--blue);color:white;border-color:var(--blue);}
.region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-bottom:1rem;}
.rc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.rc-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.rc-name{font-size:14px;font-weight:600;}
.rc-meta{font-size:11px;color:var(--text-2);}
.rc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);}
.rc-stat{background:var(--card);padding:10px 14px;}
.rc-stat-label{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.rc-stat-val{font-size:16px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text);}
.rc-stat-sub{font-size:10px;margin-top:2px;}
.rc-stat-sub.red{color:var(--red);}
.rc-stat-sub.green{color:var(--green);}
.rc-locations{padding:10px 14px;font-size:11px;color:var(--text-2);}
.rc-pbar-wrap{height:4px;background:var(--bg);overflow:hidden;}
.rc-pbar-fill{height:100%;background:var(--blue);}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:1.25rem;}
.search-wrap{position:relative;min-width:200px;}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;}
.search-input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border-2);border-radius:var(--r-sm);font-family:inherit;font-size:13px;background:var(--card);color:var(--text);outline:none;}
.search-input:focus{border-color:var(--blue);}
.btns{display:flex;gap:4px;}
.fb{padding:6px 12px;border-radius:99px;border:1px solid var(--border-2);background:var(--card);color:var(--text-2);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .12s;}
.fb.active{background:var(--blue);color:white;border-color:var(--blue);}
.sort-sel{padding:6px 10px;border-radius:var(--r-sm);border:1px solid var(--border-2);background:var(--card);font-family:inherit;font-size:12px;color:var(--text);cursor:pointer;outline:none;}
.kpi-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:1.25rem;overflow-x:auto;}
.kt{padding:8px 14px;border:none;background:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--text-2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s;}
.kt:hover{color:var(--text);}
.kt.active{color:var(--blue);border-bottom-color:var(--blue);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.lc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:box-shadow .15s,border-color .15s;}
.lc:hover{box-shadow:0 2px 12px rgba(0,0,0,.07);border-color:var(--border-2);}
.lc-head{padding:11px 14px 9px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.lc-name{font-size:13px;font-weight:600;}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap;}
.badge.on{background:var(--green-bg);color:var(--green);}
.badge.off{background:var(--red-bg);color:var(--red);}
.badge.up{background:var(--blue-bg);color:var(--blue);}
.lc-primary{padding:11px 14px 8px;}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.prog-val{font-size:20px;font-weight:600;font-family:'DM Mono',monospace;}
.prog-tgt{font-size:11px;color:var(--text-2);}
.pbar-wrap{height:4px;border-radius:4px;background:var(--bg);overflow:hidden;margin-bottom:5px;}
.pbar-fill{height:100%;border-radius:4px;}
.fill-green{background:var(--green);}
.fill-red{background:var(--red);}
.fill-blue{background:var(--blue);}
.prog-meta{font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.targets{display:grid;gap:5px;margin-bottom:10px;}
.targets.cols4{grid-template-columns:1fr 1fr 1fr 1fr;}
.tbox{background:var(--bg);border-radius:var(--r-sm);padding:7px 6px;text-align:center;}
.tbox-lbl{font-size:9px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;white-space:nowrap;}
.tbox-val{font-size:12px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text);}
.tbox-val.red{color:var(--red);}
.tbox-val.green{color:var(--green);}
.kpi-rows{border-top:1px solid var(--border);padding:4px 14px 12px;}
.kr-section-label{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;padding:8px 0 4px;}
.kr{display:flex;align-items:stretch;padding:5px 0;border-bottom:1px solid var(--border);gap:8px;}
.kr:last-child{border-bottom:none;}
.kr-left{flex:1;min-width:0;}
.kr-name{font-size:11px;color:var(--text-2);margin-bottom:3px;}
.kr-vals{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.kr-val{font-size:12px;font-weight:500;font-family:'DM Mono',monospace;}
.var-tag{font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;font-family:'DM Mono',monospace;}
.var-tag.pos{background:var(--green-bg);color:var(--green);}
.var-tag.neg{background:var(--red-bg);color:var(--red);}
.var-tag.neu{background:var(--bg);color:var(--text-2);}
.kr-targets{display:flex;gap:4px;align-items:center;flex-shrink:0;}
.kr-tbox{background:var(--bg);border-radius:4px;padding:3px 6px;text-align:center;min-width:46px;}
.kr-tbox-lbl{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;display:block;}
.kr-tbox-val{font-size:11px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text);}
.kr-tbox-val.red{color:var(--red);}
.kr-tbox-val.green{color:var(--green);}
.no-results{grid-column:1/-1;text-align:center;color:var(--text-2);padding:3rem;}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><div class="logo-mark">BB</div>Big Blue Swim School</div>
  <div class="header-right"><span>March 2026</span><span class="pill">Refreshed Mar 19, 2026</span></div>
</div>
<div class="banner">
  <div><b id="days-left"></b> <span>days left in March 2026</span></div>
  <div id="banner-extra"></div>
</div>
<div class="main">
  <div class="summary" id="summary"></div>
  <div class="view-toggle">
    <button class="vt-btn active" onclick="setView('locations',this)">Location View</button>
    <button class="vt-btn" onclick="setView('region',this)">Region View</button>
  </div>
  <div id="region-view" style="display:none;">
    <div class="region-grid" id="region-grid"></div>
  </div>
  <div id="location-view">
    <div class="kpi-tabs" id="kpi-tabs"></div>
    <div class="controls">
      <div class="search-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" id="search" type="text" placeholder="Search location…" oninput="render()">
      </div>
      <div class="btns">
        <button class="fb active" onclick="setFilter('all',this)">All locations</button>
        <button class="fb" onclick="setFilter('behind',this)">Behind target</button>
        <button class="fb" onclick="setFilter('ontrack',this)">On track</button>
      </div>
      <select class="sort-sel" id="region-sel" onchange="render()">
        <option value="all">All Regions</option>
        <option value="South">South</option>
        <option value="East">East</option>
        <option value="Midwest">Midwest</option>
        <option value="Southwest">Southwest</option>
        <option value="West">West</option>
      </select>
      <select class="sort-sel" id="sort-sel" onchange="render()">
        <option value="name">Sort: A–Z</option>
        <option value="gap">Sort: Largest rev gap</option>
        <option value="pct">Sort: % to target ↑</option>
        <option value="daily">Sort: Daily rev needed ↓</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<script>
const TODAY=new Date('2026-03-19'), MONTH_END=new Date('2026-03-31');
const DAYS_LEFT=Math.round((MONTH_END-TODAY)/86400000)+1;
const WEEKS_LEFT=DAYS_LEFT/7;

const RAW=[

  {l:"Lakewood",                r:"West",     rev:194163,revV:0.0400, lsStart:314,lsStartV:0.198, lsStop:135,lsStopV:-0.357,sched:495,schedV:1.510, attendedR:0.44,attendedV:-0.26,conv:63, convV:-0.07,newSt:197,newStV:-0.0051,retSt:44,retStV:-0.450},

function calcKpi(val,variance,lowerIsBetter){
  const target=val/(1+variance);
  const gap=lowerIsBetter?val-target:target-val;
  const pct=lowerIsBetter?Math.round((target/val)*100):Math.round((val/target)*100);
  const daily=gap>0?gap/DAYS_LEFT:0;
  const weekly=gap>0?gap/WEEKS_LEFT:0;
  return{val,target,gap,pct,daily,weekly,lowerIsBetter};
}
const FIELDS=[
  {id:'rev',      label:'Revenue',         isRev:true, lowerIsBetter:false},
  {id:'sched',    label:'Trials Scheduled',            lowerIsBetter:false},
  {id:'attended', label:'Trials Attended',             lowerIsBetter:false},
  {id:'conv',     label:'Trials Converted',            lowerIsBetter:false},
  {id:'newSt',    label:'New Students',                lowerIsBetter:false},
  {id:'retSt',    label:'Return Students',             lowerIsBetter:false},
  {id:'lsStart',  label:'Lessons Started',             lowerIsBetter:false},
  {id:'lsStop',   label:'Lessons Stopped',             lowerIsBetter:true },
];
const VARMAP={rev:'revV',sched:'schedV',attended:'attendedV',conv:'convV',newSt:'newStV',retSt:'retStV',lsStart:'lsStartV',lsStop:'lsStopV'};
const DATA=RAW.map(d=>{
  const attendedCount=Math.round(d.sched*d.attendedR);
  const full={...d,attended:attendedCount};
  const kpis={};
  FIELDS.forEach(f=>{
    const val=f.id==='attended'?attendedCount:full[f.id];
    const variance=f.id==='attended'?d.attendedV:full[VARMAP[f.id]];
    kpis[f.id]=calcKpi(val,variance,f.lowerIsBetter);
  });
  return{...full,attended:attendedCount,kpis};
});
const REGIONS=['South','East','Midwest','Southwest','West'];
const RCOLORS={South:'#0057FF',East:'#047857',Midwest:'#7C3AED',Southwest:'#B45309',West:'#B91C1C'};
function fmt(val,field){if(!field)return Math.round(val).toLocaleString();if(field.isRev)return'$'+Math.round(val).toLocaleString();return Math.round(val).toLocaleString();}
function varCls(v,inv){const r=inv?-v:v;return r>0?'pos':r<0?'neg':'neu';}
function varLbl(v){return(v>=0?'+':'')+Math.round(v*100)+'%';}
function fillCls(p){return p>=100?'fill-blue':'fill-red';}
function badge(p){return p>=100?'<span class="badge up">On Track</span>':'<span class="badge off">Behind</span>';}
let activeKpi='rev',activeFilter='all',activeView='locations';
function setView(v,btn){
  activeView=v;
  document.querySelectorAll('.vt-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('region-view').style.display=v==='region'?'':'none';
  document.getElementById('location-view').style.display=v==='locations'?'':'none';
  if(v==='region')renderRegions();
}
function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function setKpi(id){
  activeKpi=id;
  document.querySelectorAll('.kt').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  render();
}
function buildSummary(){
  const tr=DATA.reduce((s,d)=>s+d.rev,0);
  const tt=DATA.reduce((s,d)=>s+d.kpis.rev.target,0);
  const tg=tt-tr;
  const on=DATA.filter(d=>d.kpis.rev.pct>=100).length;
  const op=Math.round((tr/tt)*100);
  document.getElementById('summary').innerHTML=`
    <div class="sc accent"><div class="sc-label">Total Revenue</div><div class="sc-val">$${Math.round(tr/1000)}K</div><div class="sc-sub">${op}% of target</div></div>
    <div class="sc"><div class="sc-label">Revenue Target</div><div class="sc-val">$${Math.round(tt/1000)}K</div><div class="sc-sub">${DATA.length} locations</div></div>
    <div class="sc"><div class="sc-label">Rev Gap</div><div class="sc-val" style="color:var(--red)">$${Math.round(tg/1000)}K</div><div class="sc-sub">${DAYS_LEFT} days left</div></div>
    <div class="sc"><div class="sc-label">On Track</div><div class="sc-val" style="color:var(--green)">${on}</div><div class="sc-sub">${DATA.length-on} behind target</div></div>
    <div class="sc"><div class="sc-label">New Students</div><div class="sc-val">${DATA.reduce((s,d)=>s+d.newSt,0)}</div><div class="sc-sub">tgt: ${DATA.reduce((s,d)=>s+Math.round(d.kpis.newSt.target),0)}</div></div>
    <div class="sc"><div class="sc-label">Trials Attended</div><div class="sc-val">${DATA.reduce((s,d)=>s+d.attended,0).toLocaleString()}</div><div class="sc-sub">tgt: ${DATA.reduce((s,d)=>s+Math.round(d.kpis.attended.target),0).toLocaleString()}</div></div>
  `;
  document.getElementById('banner-extra').innerHTML=`<b>$${Math.round(tg/1000)}K</b><span> total gap · </span><b>$${Math.round(tg/DAYS_LEFT/100)*100}/day</b><span> needed</span>`;
}
function renderRegions(){
  const html=REGIONS.map(region=>{
    const locs=DATA.filter(d=>d.r===region);
    if(!locs.length)return'';
    const tr=locs.reduce((s,d)=>s+d.rev,0);
    const tt=locs.reduce((s,d)=>s+d.kpis.rev.target,0);
    const tg=tt-tr;
    const pct=Math.round((tr/tt)*100);
    const on=locs.filter(d=>d.kpis.rev.pct>=100).length;
    const daily=tg>0?Math.ceil(tg/DAYS_LEFT):0;
    const weekly=tg>0?Math.ceil(tg/WEEKS_LEFT):0;
    const tns=locs.reduce((s,d)=>s+d.newSt,0);
    const tnsT=locs.reduce((s,d)=>s+Math.round(d.kpis.newSt.target),0);
    const ta=locs.reduce((s,d)=>s+d.attended,0);
    const taT=locs.reduce((s,d)=>s+Math.round(d.kpis.attended.target),0);
    const ls=locs.reduce((s,d)=>s+d.lsStart,0);
    const lsT=locs.reduce((s,d)=>s+Math.round(d.kpis.lsStart.target),0);
    const color=RCOLORS[region];
    return `<div class="rc">
      <div class="rc-head" style="border-left:4px solid ${color};">
        <div><div class="rc-name">${region}</div><div class="rc-meta">${locs.length} locations · ${on} on track · ${locs.length-on} behind</div></div>
        <div style="text-align:right;"><div style="font-size:18px;font-weight:600;font-family:'DM Mono',monospace;">$${Math.round(tr/1000)}K</div><div style="font-size:11px;color:var(--text-2);">${pct}% of $${Math.round(tt/1000)}K target</div></div>
      </div>
      <div class="rc-pbar-wrap"><div class="rc-pbar-fill" style="width:${Math.min(100,pct)}%;background:${pct>=100?'var(--green)':'var(--red)'}"></div></div>
      <div class="rc-stats">
        <div class="rc-stat"><div class="rc-stat-label">Rev Gap</div><div class="rc-stat-val" style="color:${tg>0?'var(--red)':'var(--green)'}">$${Math.round(Math.abs(tg)/1000)}K</div><div class="rc-stat-sub ${tg>0?'red':'green'}">${tg>0?'behind':'ahead'}</div></div>
        <div class="rc-stat"><div class="rc-stat-label">Need / Day</div><div class="rc-stat-val" style="color:${daily>0?'var(--red)':'var(--green)'}">$${daily>0?Math.round(daily/100)*100:0}</div><div class="rc-stat-sub ${daily>0?'red':'green'}">${DAYS_LEFT} days left</div></div>
        <div class="rc-stat"><div class="rc-stat-label">Need / Week</div><div class="rc-stat-val" style="color:${weekly>0?'var(--red)':'var(--green)'}">$${weekly>0?Math.round(weekly/100)*100:0}</div><div class="rc-stat-sub ${weekly>0?'red':'green'}">${Math.round(WEEKS_LEFT*10)/10} wks left</div></div>
        <div class="rc-stat"><div class="rc-stat-label">New Students</div><div class="rc-stat-val">${tns}</div><div class="rc-stat-sub ${tns>=tnsT?'green':'red'}">tgt: ${tnsT}</div></div>
        <div class="rc-stat"><div class="rc-stat-label">Trials Attended</div><div class="rc-stat-val">${ta}</div><div class="rc-stat-sub ${ta>=taT?'green':'red'}">tgt: ${taT}</div></div>
        <div class="rc-stat"><div class="rc-stat-label">Lessons Started</div><div class="rc-stat-val">${ls}</div><div class="rc-stat-sub ${ls>=lsT?'green':'red'}">tgt: ${lsT}</div></div>
      </div>
      <div class="rc-locations">${locs.map(d=>d.l).join(', ')}</div>
    </div>`;
  }).join('');
  document.getElementById('region-grid').innerHTML=html;
}
function buildTabs(){
  document.getElementById('kpi-tabs').innerHTML=FIELDS.map(f=>`<button class="kt${f.id===activeKpi?' active':''}" data-id="${f.id}" onclick="setKpi('${f.id}')">${f.label}</button>`).join('');
}
function renderTargetBoxes(k,field){
  const met=k.gap<=0;
  const gL=field.lowerIsBetter?'Over by':'Gap';
  const dL=field.lowerIsBetter?'Reduce/Day':'Per Day';
  const wL=field.lowerIsBetter?'Reduce/Wk':'Per Week';
  return `<div class="targets cols4">
    <div class="tbox"><div class="tbox-lbl">${gL}</div><div class="tbox-val ${met?'green':'red'}">${met?(field.lowerIsBetter?'✓ Good':'Met!'):fmt(k.gap,field)}</div></div>
    <div class="tbox"><div class="tbox-lbl">${dL}</div><div class="tbox-val ${met?'green':'red'}">${met?'✓':fmt(k.daily,field)}</div></div>
    <div class="tbox"><div class="tbox-lbl">${wL}</div><div class="tbox-val ${met?'green':'red'}">${met?'✓':fmt(k.weekly,field)}</div></div>
    <div class="tbox"><div class="tbox-lbl">Target</div><div class="tbox-val">${fmt(k.target,field)}</div></div>
  </div>`;
}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const sort=document.getElementById('sort-sel').value;
  const region=document.getElementById('region-sel').value;
  const activeField=FIELDS.find(f=>f.id===activeKpi);
  let list=DATA.filter(d=>d.l.toLowerCase().includes(q));
  if(region!=='all')list=list.filter(d=>d.r===region);
  if(activeFilter==='behind')list=list.filter(d=>d.kpis.rev.pct<100);
  if(activeFilter==='ontrack')list=list.filter(d=>d.kpis.rev.pct>=100);
  if(sort==='name')list.sort((a,b)=>a.l.localeCompare(b.l));
  if(sort==='gap')list.sort((a,b)=>b.kpis.rev.gap-a.kpis.rev.gap);
  if(sort==='pct')list.sort((a,b)=>a.kpis.rev.pct-b.kpis.rev.pct);
  if(sort==='daily')list.sort((a,b)=>b.kpis.rev.daily-a.kpis.rev.daily);
  if(!list.length){document.getElementById('grid').innerHTML='<div class="no-results">No locations match.</div>';return;}
  document.getElementById('grid').innerHTML=list.map(d=>{
    const pk=d.kpis[activeKpi];
    const fp=Math.min(100,pk.pct);
    const v=activeKpi==='attended'?d.attendedV:d[VARMAP[activeKpi]];
    const pVarCls=varCls(v,activeField.lowerIsBetter);
    const otherRows=FIELDS.filter(f=>f.id!==activeKpi).map(f=>{
      const k=d.kpis[f.id];
      const fv=f.id==='attended'?d.attendedV:d[VARMAP[f.id]];
      const met=k.gap<=0;
      const gL=f.lowerIsBetter?'Over':'Gap';
      const dL=f.lowerIsBetter?'-/Day':'/Day';
      const wL=f.lowerIsBetter?'-/Wk':'/Wk';
      return `<div class="kr">
        <div class="kr-left">
          <div class="kr-name">${f.label}${f.lowerIsBetter?' <span style="font-size:9px;opacity:.6">(lower=better)</span>':''}</div>
          <div class="kr-vals"><span class="kr-val">${fmt(k.val,f)}</span><span class="var-tag ${varCls(fv,f.lowerIsBetter)}">${varLbl(fv)}</span><span style="font-size:10px;color:var(--text-3)">/ tgt ${fmt(k.target,f)}</span></div>
        </div>
        <div class="kr-targets">
          <div class="kr-tbox"><span class="kr-tbox-lbl">${gL}</span><span class="kr-tbox-val ${met?'green':'red'}">${met?'✓':fmt(k.gap,f)}</span></div>
          <div class="kr-tbox"><span class="kr-tbox-lbl">${dL}</span><span class="kr-tbox-val ${met?'green':'red'}">${met?'✓':fmt(k.daily,f)}</span></div>
          <div class="kr-tbox"><span class="kr-tbox-lbl">${wL}</span><span class="kr-tbox-val ${met?'green':'red'}">${met?'✓':fmt(k.weekly,f)}</span></div>
        </div>
      </div>`;
    }).join('');
    return `<div class="lc">
      <div class="lc-head">
        <div class="lc-name">${d.l}</div>
        <div style="display:flex;gap:5px;align-items:center;">
          <span style="font-size:10px;color:var(--text-3);background:var(--bg);padding:2px 6px;border-radius:4px;">${d.r}</span>
          ${badge(d.kpis.rev.pct)}
        </div>
      </div>
      <div class="lc-primary">
        <div class="prog-top"><span class="prog-val">${fmt(pk.val,activeField)}</span><span class="prog-tgt">target: ${fmt(pk.target,activeField)}</span></div>
        <div class="pbar-wrap"><div class="pbar-fill ${fillCls(fp)}" style="width:${fp}%"></div></div>
        <div class="prog-meta"><span>${fp}% of target</span><span class="var-tag ${pVarCls}">${varLbl(v)}</span></div>
        ${renderTargetBoxes(pk,activeField)}
      </div>
      <div class="kpi-rows"><div class="kr-section-label">All KPIs — Gap · Per Day · Per Week</div>${otherRows}</div>
    </div>`;
  }).join('');
}
buildSummary();
buildTabs();
render();
</script>
</body>
</html>
